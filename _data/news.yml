- title: JRF Opening at IISER Berhampur – Cryo-EM Research
  date: 23 July 2025
  author: Dr. Shanti S. Srivastava
  image: images/random66.jpg
  link: https://www.iiserbpr.ac.in/home/activity_view/399
  text: >
    Applications invited for 1 JRF position in a SERB-funded project on bacterial innate immunity at
