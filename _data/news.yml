- title: Rigaku XtaLAB Synergy-DW Single Crystal XRD System Installed
  date: April 2025
  author: Lab Admin
  image: images/random5.jpg
  text: >
    The Rigaku XtaLAB Synergy-DW Single Crystal XRD System is now fully operational at CAIF, IISER
    Berhampur. This state-of-the-art instrument will significantly enhance our capabilities in
    structural biology, chemistry, and materials science by enabling high-resolution single crystal
    diffraction analysis. Its installation marks a major step forward in supporting advanced research
    and interdisciplinary collaboration across the institute.

- title: New ÄKTA Start System Installed
  date: February 2025
  author: Lab Admin
  image: https://www.sigmaaldrich.com/deepweb/assets/sigmaaldrich/product/images/121/394/07ae51ac-027a-496e-bb6a-03f569ee9c79/640/07ae51ac-027a-496e-bb6a-03f569ee9c79.jpg
  text: >
    We are excited to announce the successful installation of the new ÄKTA start system in
    Institute's CAIF. This state-of-the-art protein purification system has already enhanced our
    capabilities in isolating and characterizing biomolecules with precision and efficiency.

