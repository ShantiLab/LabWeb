- title: Interface interactions between βγ-crystallin domain and Ig-like domain render Ca2+-binding site
    inoperative in abundant perithecial protein of Neurospora crassa
  journal: Molecular Microbiology
  date: 14 Sept 2018
  year: 2018
  url: https://onlinelibrary.wiley.com/doi/full/10.1111/mmi.14130
  image: images/blog/14.jpg
  authors: Shanti Swaroop Srivastava, Rajeev Raman, Uday Kiran, Rupsi Garg, Swathi Chadalawada, Asmita
    D. Pawar, Rajan Sankaranarayanan, Yogendra Sharma
  summary: This study investigates how interdomain interactions in the abundant perithecial protein (APP)
    of *Neurospora crassa* render its Ca2+-binding site inactive, revealing a novel mode of Ca2+-binding
    regulation in proteins with both βγ-crystallin and Ig-like domains.
- title: A Transition Metal-Binding, Trimeric βγ-Crystallin from Methane-Producing Thermophilic Archaea,
    Methanosaeta thermophila
  journal: Biochemistry Vol 56, Issue 9
  date: 28 Dec 2016
  year: 2016
  url: https://pubs.acs.org/doi/full/10.1021/acs.biochem.6b00985
  image: images/blog/12.jpg
  authors: Shanti Swaroop Srivastava, Aditya Anand Jamkhindikar, Rajeev Raman, Maroor K. Jobby, Swathi
    Chadalawada, Rajan Sankaranarayanan, Yogendra Sharma
  summary: This study reveals that Methallin, a βγ-crystallin from Methanosaeta thermophila, is a trimeric,
    transition metal-binding protein, providing new insights into its potential biogeochemical roles and
    high-affinity metal ion binding.
- title: Microbial βγ-crystallins
  journal: Progress in Biophysics and Molecular Biology
  date: 1 Jul 2014
  year: 2014
  url: https://www.sciencedirect.com/science/article/pii/S0079610714000108
  image: images/blog/beta.jpg
  authors: Amita Mishra, Bal Krishnan, Shanti Swaroop Srivastava, Yogendra Sharma
  summary: This review highlights microbial βγ-crystallins as a diverse superfamily of Ca2+-binding proteins,
