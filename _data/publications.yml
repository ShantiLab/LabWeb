- title: Cryo-EM structure of the N501Y SARS-CoV-2 spike protein in complex with a potent neutralizing
    antibody
  journal: bioRxiv (preprint)
  date: '2021'
  year: 2021
  url: https://pubmed.ncbi.nlm.nih.gov/33914735/
  image: images/blog/11.jpg
  authors: Xing Zhu, Dhiraj Mannar, Shanti Swaroop Srivastava, Alison Berezuk, Jean-Philippe Demers, James
    Saville, Karoline Leopold, Wei Li, Dimiter S Dimitrov, Katharine Tuttle, Steven Zhou, Sagar Chittori,
