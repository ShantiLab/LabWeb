- title: Cryo-EM structures of the N501Y SARS-CoV-2 spike protein in complex with ACE2 and neutralizing
    antibodies
  journal: PLoS Biology
  date: 29 Apr 2021
  year: 2021
  url: https://journals.plos.org/plosbiology/article?id=10.1371/journal.pbio.3001237
  image: images/blog/2.jpg
