- title: 'SARS-CoV-2 variants of concern: spike protein mutational analysis and epitope for broad neutralization'
  journal: Nature Communications
  date: 18 Aug 2022
  year: 2022
  url: https://www.nature.com/articles/s41467-022-32262-8
  image: images/blog/5.jpg
  authors: Dhiraj Mannar, James W. Saville, Zehua Sun, Xing Zhu, Michelle M. Marti, Shanti S. Srivastava,
    Alison M. Berezuk, Steven Zhou, Katharine S. Tuttle, Michele D. Sobolewski, Andrew Kim, Benjamin R.
    Treat, Priscila Mayrelle Da Silva Castanha, Jana L. Jacobs, Simon M. Barratt-Boyes, John W. Mellors,
