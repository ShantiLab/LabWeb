- title: Three-Dimensional Visualization of Viral Structure, Entry, and Replication Underlying the Spread
    of SARS-CoV-2
  journal: Chemical Reviews
  date: 21 Jul 2022
  year: 2022
  url: https://pubs.acs.org/doi/abs/10.1021/acs.chemrev.1c01062
  image: images/blog/7.jpg
  authors: James W Saville, Alison M Berezuk, Shanti S Srivastava, Sriram Subramaniam
  summary: This review details structural biology and pathobiology of SARS-CoV-2, focusing on its life
