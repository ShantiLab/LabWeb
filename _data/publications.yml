- title: High Potency of a Bivalent Human VH Domain in SARS-CoV-2 Animal Models
  journal: Cell
  date: 15 Oct 2020
  year: 2020
  url: https://www.sciencedirect.com/science/article/pii/S009286742031148X
  image: images/blog/15.jpg
  authors: Wei Li, Alexandra Schäfer, Swarali S. Kulkarni, Xianglei Liu, David R. Martinez, Chuan Chen,
    Zehua Sun, Sarah R. Leist, Aleksandra Drelich, and others
  summary: A novel human antibody domain, VH ab8, was developed showing strong neutralizing effects against
    SARS-CoV-2 in mice and hamsters. Its small size and bivalency made it highly effective in targeting
    the virus and blocking ACE2 interaction, positioning it as a promising COVID-19 therapeutic.
- title: Plasmodium vivax and human hexokinases share similar active sites but display distinct quaternary
    architectures
  journal: IUCrJ Volume 7, Part 3
  date: May 2020
  year: 2020
  url: https://doi.org/10.1107/S2052252520002456
  image: images/blog/10.jpg
  authors: Shanti Swaroop Srivastava, Joseph E. Darling, Jimmy Suryadi, James C. Morris, Mark E. Drew,
    Sriram Subramaniam
  summary: This study reports cryo-EM structures of Plasmodium vivax hexokinase (PvHK), revealing a unique
    tetrameric organization that is distinct from human hexokinases, providing insights for the design
    of parasite-selective antimalarial drugs.
- title: βγ-Crystallination Endows a Novel Bacterial Glycoside Hydrolase 64 with Ca2+-Dependent Activity
    Modulation
  journal: Journal of Bacteriology Vol 201, No. 23
  date: 5 Nov 2019
  year: 2019
  url: https://doi.org/10.1128/jb.00392-19
  image: images/blog/13.jpg
  authors: Bal Krishnan, Shanti Swaroop Srivastava, Venu Sankeshi, Rupsi Garg, Sudhakar Srivastava, Rajan
    Sankaranarayanan, Yogendra Sharma
  summary: This study explores the role of a βγ-crystallin domain in modulating the enzymatic activity
