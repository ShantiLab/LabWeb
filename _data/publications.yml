- title: 'SARS-CoV-2 Omicron variant: Antibody evasion and cryo-EM structure of spike protein–ACE2 complex'
  journal: Science
  date: 20 Jan 2022
  year: 2022
  url: https://www.science.org/doi/full/10.1126/science.abn7760
  image: images/blog/blog01.jpg
  summary: Mannar, Saville, Zhu, Srivastava, Berezuk, Tuttle, Marquez, Sekirov, and Subramaniam present
    the cryo-EM structure of the SARS-CoV-2 Omicron variant spike protein bound to human ACE2, revealing
    how mutations allow antibody evasion and maintain receptor binding. This study offers insight into
    Omicron’s rapid spread and immune resistance.
- title: Structural analysis of receptor binding domain mutations in SARS-CoV-2 variants of concern that
    modulate ACE2 and antibody binding
  journal: Cell Reports
  date: 21 Dec 2021
  year: 2021
  url: https://www.cell.com/cell-reports/fulltext/S2211-1247(21)01652-1?dgcid=raven_jbs_etoc_email
