  journal: Biochemistry Vol 51/Issue 43
  date: 8 Oct 2012
  year: 2012
  url: https://pubs.acs.org/doi/full/10.1021/bi300844u
  image: images/blog/9.jpg
  authors: V. Rajanikanth, Shanti Swaroop Srivastava, Aditya K. Singh, M. Rajyalakshmi, Kousik Chandra,
