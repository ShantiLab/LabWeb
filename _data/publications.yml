- title: Structural and biochemical rationale for enhanced spike protein fitness in delta and kappa SARS-CoV-2
    variants
  journal: Nature Communications
  date: 8 Feb 2022
  year: 2022
  url: https://www.nature.com/articles/s41467-022-28353-x
  image: images/blog/3.jpg
  authors: James W. Saville, Dhiraj Mannar, Xing Zhu, Shanti S. Srivastava, Alison M. Berezuk, Jean-Philippe
    Demers, Steven Zhou, Katharine S. Tuttle, Inna Sekirov, Andrew Kim, Wei Li, Dimiter S. Dimitrov, Sriram
