# Main menu. "children" makes a dropdown.
nav:
  - title: Home
    url: /
  - title: Publications
    url: /publications
  - title: Team
    url: /team
  - title: Research
    children:
      - title: Glycoside Hydrolases & Glycosyl Transferases
        url: /gh-gt
      - title: Bacterial Innate Immunity
        url: /bacterial-immunity
      - title: PP2A
        url: /pp2a
      - title: Protocols
        url: /coming-soon
  - title: Contact Us
    url: /contact

# Profile pages (one Markdown file per person in _people/) and
# research project pages (one file per project in _research/).
# Both keep their existing addresses, e.g. rohit.html, pp2a.html.
collections:
  people:
    output: true
    permalink: /:name.html
  research:
    output: true
    permalink: /:name.html

defaults:
  - scope: { path: "", type: people }
    values: { layout: person }
  - scope: { path: "", type: research }
    values: { layout: research }
  - scope: { path: "" }
    values: { layout: default }

markdown: kramdown
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - .claude
